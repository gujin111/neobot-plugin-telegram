[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib 模式：插件根目录有 __init__.py，prepend 模式会把整个目录当包导入，
# 进而触发 __init__.py 的相对导入失败（目录名带连字符，包名不合法）。
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
