name = "telegram"
version = "2.0.0"
description = "Telegram 直连 AI：TG 用户直接和 NeoBot 对话（只保留状态查询命令）"
author = "NeoBot 第三方插件"
license = "MIT"
tags = ["telegram", "im", "chat", "adapter"]
repo = "https://github.com/gujin111/neobot-plugin-telegram"
branch = "main"
homepage = "https://github.com/gujin111/neobot-plugin-telegram#readme"
python_dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2,<3",
]
hot_reload = true
config_hot_reload = false
min_neobot_version = "2.0.0"

# 下面只是「打包默认值」：安装/更新插件会覆盖这一段。
# 真正的运行配置在 data/plugins_data/telegram/config.toml（面板「插件 → 配置」可改）。

[config]
# 总开关；关闭后不连 Telegram（命令仍可用）
enabled = true
# BotFather 发的机器人令牌：123456:ABC-DEF...
token = ""
# Telegram Bot API 终结点；直连不通时改为反代地址
endpoint = "https://api.telegram.org"
# 反代基址（如 https://tg.example.com）；填了它优先于 endpoint
reverse_proxy_url = ""
# 反代路径密钥，与 Worker 的 PATH_SECRET 一致；没设就留空
reverse_proxy_secret = ""
# 网络代理。支持 http://…、socks5://…（内置实现，不需要 socksio），或 auto 自动探测；留空直连
proxy = ""
# 通信方式：polling（长轮询，免公网）
protocol = "polling"
# 长轮询单次等待秒数
polling_timeout = 25
# 初次连接失败的最大重试次数
retry_times = 6
# 断开后的重试间隔（秒）
retry_interval = 5.0
# 只接收这些类型的更新；留空 = 全部（含 chat_member）
allowed_updates = []
# 以 HTML 解析格式发送
parse_mode = "html"
# 发送链接时展示网页预览
link_preview = true
# 长文本自动分段长度上限（Telegram 上限 4096）
chunk_size = 3500
# 忽略 Telegram 侧其它机器人发的消息
ignore_telegram_bots = true

# ── AI 接入：TG 消息交给宿主的回复管线生成，再把文本发回 TG ──
# AI 工作区类型：private（私聊）/ group（群聊）
ai_endpoint_kind = "private"
# AI 工作区 ID：一个 QQ 号（私聊）或群号（群聊）。AI 在这里生成回复，宿主也会把回复发到这里
ai_endpoint_id = ""
# AI 工作区所在通道：onebot / official；留空让宿主自动判断
ai_channel = ""
# 交给 AI 时给消息加的前缀，支持 {name} {chat} {id}
ai_prefix = "[TG {name}] "
# 等待 AI 生成回复的超时（秒）
ai_timeout = 90.0
# AI 没产出时回给 TG 用户的文案；留空则不回复
ai_error_reply = "（AI 暂时没有响应，请稍后再试）"

[sdk]
version = 1
contract = "plugin.contract.json"
