name = "telegram"
version = "3.1.1"
description = "Telegram 独立 Bot：只填 token 即可用（内置反代），AI 由宿主模型驱动"
author = "NeoBot 第三方插件"
license = "MIT"
tags = ["telegram", "im", "chat", "adapter"]
repo = "https://github.com/gujin111/neobot-plugin-telegram"
branch = "main"
homepage = "https://github.com/gujin111/neobot-plugin-telegram#readme"
python_dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2,<3",
]
hot_reload = true
config_hot_reload = false
min_neobot_version = "2.0.0"

# 下面只是「打包默认值」：安装/更新插件会覆盖这一段。
# 真正的运行配置在 data/plugins_data/telegram/config.toml（面板「插件 → 配置」可改）。

[config]
# 总开关；关闭后不连 Telegram（命令仍可用）
enabled = true
# BotFather 发的机器人令牌：123456:ABC-DEF...
token = ""

# ── 网络：默认走内置反代，所以只需要 token ──
# 反代基址；留空则改用 endpoint / proxy 直连
reverse_proxy_url = "https://tg.gujin99.xyz"
# 反代路径密钥，与 Worker 的 PATH_SECRET 一致
reverse_proxy_secret = "v1-a5e68cb17320"
# 反代请求头密钥（X-Proxy-Key），与 Worker 的 PROXY_KEY 一致
proxy_key = "pk-a5e68cb17320"
# Bot API 终结点；反代留空时才用它
endpoint = "https://api.telegram.org"
# http(s) 代理，如 http://127.0.0.1:7890；SOCKS 请填代理软件的 HTTP 端口
proxy = ""
# 长轮询单次等待秒数
polling_timeout = 25
# 连续失败多少次后放弃（0 = 一直重试）
retry_times = 6
# 失败重试间隔（秒）
retry_interval = 5.0
# 忽略其它机器人发的消息
ignore_telegram_bots = true

# ── AI：直接用宿主的主模型服务（Provider）与宿主已写好的人格/提示词 ──
# host = 沿用 NeoBot 面板里的昵称与人格（bot_data），并追加下面的补充提示词
# custom = 只用下面的 system_prompt
prompt_source = "host"
# 补充提示词；prompt_source=custom 时它就是全部（留空则没有系统提示词）
system_prompt = ""
# 额外拼接的宿主提示词分区（prompts.toml 段名），例如 ["gentle_language", "human_feel"]
host_prompt_sections = []
# 每个 TG 会话保留的历史消息条数（0 = 无上下文）
history_limit = 12
# 单次模型调用超时（秒）
ai_timeout = 120.0
# 模型失败时回给用户的文案；留空则不回复
ai_error_reply = "（AI 暂时没有响应，请稍后再试）"

[sdk]
version = 1
contract = "plugin.contract.json"
