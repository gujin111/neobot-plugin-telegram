name = "telegram"
version = "2.3.0"
description = "Telegram 独立 Bot：只填 token 即可用（内置反代 + 请求头校验），不涉及 QQ"
author = "NeoBot 第三方插件"
license = "MIT"
tags = ["telegram", "im", "chat", "adapter"]
repo = "https://github.com/gujin111/neobot-plugin-telegram"
branch = "main"
homepage = "https://github.com/gujin111/neobot-plugin-telegram#readme"
python_dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2,<3",
]
hot_reload = true
config_hot_reload = false
min_neobot_version = "2.0.0"

# 下面只是「打包默认值」：安装/更新插件会覆盖这一段。
# 真正的运行配置在 data/plugins_data/telegram/config.toml（面板「插件 → 配置」可改）。

[config]
# 总开关；关闭后不连 Telegram（命令仍可用）
enabled = true
# BotFather 发的机器人令牌：123456:ABC-DEF...
token = ""
# Telegram Bot API 终结点；反代留空时才用它
endpoint = "https://api.telegram.org"
# 默认走内置反代：用户只填 token 就能用，不需要代理/域名
# 想直连或用自己的反代，把这一行清空 / 改成自己的地址
reverse_proxy_url = "https://tg.gujin99.xyz"
# 内置反代的路径密钥；换成自己的反代时改成自己的
reverse_proxy_secret = "v1-a5e68cb17320"
# 反代请求头密钥（X-Proxy-Key）；与 Worker 的 PROXY_KEY 一致，自建时改成自己的
proxy_key = "pk-a5e68cb17320"
# 网络代理。支持 http://…、socks5://…（内置实现，不需要 socksio），或 auto 自动探测；留空直连
proxy = ""
# 通信方式：polling（长轮询，免公网）
protocol = "polling"
# 长轮询单次等待秒数
polling_timeout = 25
# 初次连接失败的最大重试次数
retry_times = 6
# 断开后的重试间隔（秒）
retry_interval = 5.0
# 只接收这些类型的更新；留空 = 全部（含 chat_member）
allowed_updates = []
# 以 HTML 解析格式发送
parse_mode = "html"
# 发送链接时展示网页预览
link_preview = true
# 长文本自动分段长度上限（Telegram 上限 4096）
chunk_size = 3500
# 忽略 Telegram 侧其它机器人发的消息
ignore_telegram_bots = true

# ── AI：直接调用宿主的主模型服务（Provider），全程不涉及 QQ ──
# 系统提示词（人格设定）
system_prompt = "你是 NeoBot，一个友好的聊天助手。用简短自然的方式回答。"
# 每个 TG 会话保留的历史消息条数（0 = 无上下文）
history_limit = 12
# 单次模型调用超时（秒）
ai_timeout = 120.0
# 模型失败时回给用户的文案；留空则不回复
ai_error_reply = "（AI 暂时没有响应，请稍后再试）"

[sdk]
version = 1
contract = "plugin.contract.json"
